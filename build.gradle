plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.ordersense'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        sourceCompatibility = '21'
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    // 모든 서비스 공통 의존성
    dependencies {
        // Spring Boot 기본
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        implementation 'org.springframework.boot:spring-boot-starter-actuator'

        // Kafka
        implementation 'org.springframework.kafka:spring-kafka'

        // Database
        runtimeOnly 'org.postgresql:postgresql'
        implementation 'org.springframework.boot:spring-boot-starter-data-redis'

        // Monitoring
        implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.19.1'
        implementation 'io.micrometer:micrometer-registry-prometheus'

        // Logging (ELK)
        implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

        // Utility
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'org.mapstruct:mapstruct:1.6.3.Final'
        annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3.Final'

        // OpenAPI 문서화
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'

        // 테스트
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.springframework.kafka:spring-kafka-test'
        testImplementation 'org.testcontainers:postgresql:2.0.2'
        testImplementation 'org.testcontainers:kafka:2.0.2'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}